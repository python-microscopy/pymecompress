name: Build PIP packages

on:
  release:
    types: [created, edited]

  workflow_dispatch:

jobs:
  deploy_source:
    runs-on: 'macos-latest'

    environment:
      name: pypi
      url: https://pypi.org/p/pymecompress
    permissions:
      id-token: write  # mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build source distribution
      run: |
        python -m build --sdist
    - name: Publish source distribution
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        skip-existing: true
    
  deploy_wheel_mac:
    needs: deploy_source #don't build wheels unless we successfully built source package.
    strategy:
      matrix:
        os: [macos-latest] #, ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.13','3.14', '3.15']
        arch: [x86_64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64
          - os: ubuntu-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    environment:
      name: pypi
      url: https://pypi.org/p/pymecompress
    permissions:
      id-token: write  # mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python }}
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build wheel
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          arch -${{ matrix.arch }} python -m build --wheel
        else
          python -m build --wheel
        fi
    - name: Publish wheel
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        skip-existing: true

  deploy_wheel_win:
    needs: deploy_source #don't build wheels unless we successfully built source package.
    strategy:
      matrix:
        os: [windows-latest]
        python: ['3.11', '3.12', '3.13', '3.13','3.14', '3.15'] #,2.7] - # 2.7 disabled for now due to missing VC9

    runs-on: ${{ matrix.os }}

    environment:
      name: pypi
      url: https://pypi.org/p/pymecompress
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies # uses conda specifically to get mingw64 toolchain and a non-msvc complier (as code uses gcc specific AVX intrinsics)
      run: |
        conda install wheel cython numpy pyyaml libpython m2w64-toolchain
        python -m pip install --upgrade build meson meson-python      
    - name: Build wheel
      run: |
        python -m build --wheel --no-isolation -Csetup-args="--native-file=${{ github.workspace }}\mingw_native.ini"
    
    # Publish wheel using gh-action-pypi-publish
    - name: Publish wheel
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        skip-existing: true

