name: Build PIP packages

on:
  release:
    types: [created, edited]

  workflow_dispatch:

jobs:
  deploy_source:
    runs-on: 'macos-latest'

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build source distribution
      run: |
        python -m build --sdist
    - name: Upload source distribution
      uses: actions/upload-artifact@v4
      with:
        name: dist-sdist
        path: dist/*.tar.gz
    
  deploy_wheel_mac:
    needs: deploy_source #don't build wheels unless we successfully built source package.
    strategy:
      matrix:
        os: [macos-latest] #, ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.13','3.14', '3.15']
        arch: [x86_64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64
          - os: ubuntu-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python }}
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build wheel
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          arch -${{ matrix.arch }} python -m build --wheel
        else
          python -m build --wheel
        fi
    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: dist-mac-${{ matrix.python }}-${{ matrix.arch }}
        path: dist/*.whl

  deploy_wheel_win:
    needs: deploy_source #don't build wheels unless we successfully built source package.
    strategy:
      matrix:
        os: [windows-latest]
        python: ['3.11', '3.12', '3.13', '3.13','3.14', '3.15'] #,2.7] - # 2.7 disabled for now due to missing VC9

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: conda-incubator/setup-miniconda@v2
      with:
        python-version: ${{ matrix.python }}
    - name: Install dependencies # uses conda specifically to get mingw64 toolchain and a non-msvc complier (as code uses gcc specific AVX intrinsics)
      run: |
        conda install wheel cython numpy pyyaml libpython m2w64-toolchain
        python -m pip install --upgrade build meson meson-python      
    - name: Build wheel
      run: |
        python -m build --wheel --no-isolation -Csetup-args="--native-file=${{ github.workspace }}\mingw_native.ini"
    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: dist-win-${{ matrix.python }}
        path: dist/*.whl

  # gh-action-pypi-publish only runs on Linux, so publish everything from one job.
  publish:
    needs: [deploy_source, deploy_wheel_mac, deploy_wheel_win]
    # Uncomment to publish whatever built even if some matrix jobs failed:
    # if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/pymecompress
    permissions:
      id-token: write  # mandatory for trusted publishing

    steps:
    - name: Download all distributions
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true
    - name: Publish distributions
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        skip-existing: true

    # - name: Build and publish
    #   env:
    #     TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
    #     TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
    #   run: |
    #     python -m build --wheel --no-isolation -Csetup-args="--native-file=${{ github.workspace }}\mingw_native.ini"
    #     twine upload --skip-existing dist/*